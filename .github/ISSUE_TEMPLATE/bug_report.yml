name: Bug report
description: Something in the fork is broken or behaves incorrectly.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For an error in a dictionary entry's content (not the code), use the
        "Lexicon data issue" template instead.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including the URL or admin page involved.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does this happen
      multiple: true
      options:
        - Public site — /lex (legacy IELEX)
        - Public site — /lexicon (multi-lexicon framework)
        - Public site — EIEOL lessons
        - Admin — /admin (Filament)
        - Admin — /admin2 (legacy Vue editor)
        - API
        - Other / not sure
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL (if applicable)
      placeholder: https://lrc.la.utexas.edu/...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser/OS, or "server-side" if this is a backend/CLI issue.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, error messages, stack traces, related issues.
