services:
  web:
    build:
      context: .
    ports:
      - "80"
    volumes:
      - './server:/var/www/html'
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST:-lrc.localhost.utexas.edu}
      - APP_NAME=LRC
      - APP_ENV=local
      # APP_KEY is set in compose.override.yaml (created by `make init` from
      # compose.override.yaml.example). Never commit a real key here.
      - APP_DEBUG=true
      - APP_URL=${APP_URL:-https://lrc.localhost.utexas.edu}
      - LOG_CHANNEL=errorlog
      - DB_CONNECTION=mariadb
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=lrc
      - DB_USERNAME=lrc
      - DB_PASSWORD=lrc
      - CACHE_STORE=database
      - FILESYSTEM_DRIVER=public
      - SESSION_DRIVER=database
      - SESSION_LIFETIME=120
      - VIEW_COMPILED_PATH=/tmp/laravel
  db:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: 'lrc'
      MYSQL_USER: 'lrc'
      MYSQL_PASSWORD: 'lrc'
      MYSQL_ROOT_PASSWORD: 'lrc'
    ports:
      - '${DB_EXPOSED_PORT:-13309}:3306'
    expose:
      - '3306'
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: